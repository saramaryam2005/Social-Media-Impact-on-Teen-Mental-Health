<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Teen Mental Health Prediction Model</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>


</head>
<body>
    <div class="login">
        <h1>Teen Mental Health Prediction</h1>
         <!-- Main Input For Recieving Query to our ML-->
        <form action="{{ url_for('predict') }}" method="POST">
        
          <label for="gender">Gender:</label>
<select name="gender" id="gender" required>
    
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>
<br><br>
            <label for="platform_usage">platform_usage:</label>
<select name="platform_usage" id="platform_usage" required>
    
    <option value="Instagram">Instagram</option>
    <option value="TikTok">TikTok</option>
    <option value="Both">Both</option>
</select>
<br><br>
         <label for="social_interaction_level">social_interaction_level:</label>
<select name="social_interaction_level" id="social_interaction_level" required>
    
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
</select>
<br><br>
        
          <label for="age">Age:</label> <input type="text" name="age" placeholder="age" required="required" /> <br>
          <label for="daily_social_media_hours">Daily Social Media Hours:</label> <input type="text" name="daily_social_media_hours" placeholder="daily_social_media_hours" required="required" /><br>
          <label for="sleep_hours">Sleep Hours:</label> <input type="text" name="sleep_hours"  placeholder ="sleep_hours"  required="required" /><br>
          <label for="screen_time_before_sleep">Screen Time Before Sleep:</label> <input type="text" name="screen_time_before_sleep" placeholder ="screen_time_before_sleep" required="required" /><br>
          <label for="academic_performance">Academic Performance:</label> <input type="text" name="academic_performance"placeholder = "academic_performance" required="required" /><br>
          <label for="physical_activity">Physical Activity:</label> <input type="text"name="physical_activity" placeholder ="physical_activity" required="required" /><br>
          <label for="stress_level">Stress Level:</label> <input type="text"name="stress_level" placeholder ="stress_level" required="required" /><br>
          <label for="anxiety_level">anxiety_levell:</label> <input type="text"name="anxiety_level"  placeholder ="anxiety_level" required="required" /><br>
          <label for="addiction_level">Addiction Level:</label> <input type="text"name="addiction_level" placeholder ="addiction_level" required="required" /><br>
          <button type ="submit" class="btn btn-primary btn-block btn-large"> Predict </button>
        </form>
        <br>
        <br>
    </div>
    {{prediction_text}}

</body>
</html>
